<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>dutr4 finanças</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="dutr4.svg" alt="dutr4" class="logo">
  <button id="sair" class="link" hidden>Sair</button>
</header>

<main id="login" hidden>
  <h1>Entrar</h1>
  <form id="f-login">
    <label>Senha<input id="senha" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primario">Entrar</button>
    <p id="erro-login" class="erro"></p>
  </form>
</main>

<main id="app" hidden>
  <section>
    <h1>Novo lançamento</h1>
    <form id="f-novo">
      <label>Valor (R$)<input id="valor" inputmode="decimal" placeholder="0,00" required autocomplete="off"></label>
      <label>Descrição<input id="descricao" placeholder="Ex.: Mercado" required autocomplete="off"></label>
      <div class="linha">
        <label>Categoria<select id="categoria" required></select></label>
        <label>Quem<select id="quem" required></select></label>
      </div>
      <div class="linha">
        <label>Conta/Cartão<select id="conta" required></select></label>
        <label>Data<input id="data" type="date" required></label>
      </div>
      <fieldset><legend>Tipo</legend><div id="tipos" class="seg"></div></fieldset>
      <details>
        <summary>Mais opções</summary>
        <div class="linha">
          <label>Parcelas<input id="parcelas" inputmode="numeric" placeholder="1"></label>
          <label>Obs<input id="obs" autocomplete="off"></label>
        </div>
      </details>
      <button type="submit" class="primario" id="salvar">Salvar</button>
      <p id="msg" class="msg" role="status"></p>
    </form>
  </section>

  <section>
    <h2 id="titulo-mes">Mês atual</h2>
    <div id="totais" class="totais"></div>
    <div id="cats"></div>
  </section>

  <section>
    <h2>Últimos lançamentos</h2>
    <ul id="recentes" class="lista"></ul>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
